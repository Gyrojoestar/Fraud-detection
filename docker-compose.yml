services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_api_container
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
      - DATABASE_PW=${DATABASE_PW}
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./card_cleaned_keep.csv:/app/card_cleaned_keep.csv:ro
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    ports:
      - "5432:5432"
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_init
    depends_on:
      - postgres
    env_file:
      - .env
    command: >
      bash -c "airflow db migrate &&
              airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"

  scheduler:
    image: fraud-detection-airflow:2.8.1
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./backend:/opt/airflow/backend
      - ./model_training:/opt/airflow/model_training
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: scheduler

  webserver:
    image: fraud-detection-airflow:2.8.1
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      PYTHONPATH: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./backend:/opt/airflow/backend
      - ./model_training:/opt/airflow/model_training
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver