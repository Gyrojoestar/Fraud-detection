services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-detection-api:v3
    container_name: fraud_api_container
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /app/mlruns
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped